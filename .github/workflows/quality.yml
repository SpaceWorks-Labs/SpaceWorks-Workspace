name: Quality gate
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  scripts-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm run deployment:check
      - uses: azure/setup-helm@v4
      - run: helm lint charts/spaceworks-workspace --set existingSecret=sww-runtime
      - run: helm template sww charts/spaceworks-workspace --set existingSecret=sww-runtime --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null
  application:
    uses: ./.github/workflows/ci.yml
  cloudflare-cron:
    name: Independent cron dependency and bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Audit and dry-run the isolated cron package without credentials
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/source" "$work/home" "$work/cache"
          git archive HEAD deploy/cloudflare-cron | tar -xf - -C "$work/source"
          cd "$work/source/deploy/cloudflare-cron"
          rm -f -- .env .env.* .dev.vars .dev.vars.*
          clean_env=(env -i "PATH=$PATH" "HOME=$work/home" "XDG_CONFIG_HOME=$work/home/config" "XDG_CACHE_HOME=$work/cache" CI=true WRANGLER_SEND_METRICS=false)
          "${clean_env[@]}" npm ci --ignore-scripts --no-fund
          "${clean_env[@]}" npm audit --audit-level=high --ignore-scripts
          "${clean_env[@]}" npm run check
  container:
    name: Two-image installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Install and restore from a private disposable source copy
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/sww-private-install.XXXXXX")
          trap 'sudo rm -rf -- "$work"' EXIT
          git archive HEAD | tar -xf - -C "$work"
          chmod 600 "$work/docker/vps/pg_hba.conf"
          chmod 700 "$work/docker/vps/init-database.sh"
          cd "$work"
          bash scripts/test-vps-install.sh
