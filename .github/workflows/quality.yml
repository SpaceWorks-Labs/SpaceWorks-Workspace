name: Quality gate
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  scripts-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm run deployment:check
      - uses: azure/setup-helm@v4
      - run: helm lint charts/spaceworks-workspace --set existingSecret=sww-runtime
      - run: helm template sww charts/spaceworks-workspace --set existingSecret=sww-runtime --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null
  application:
    uses: ./.github/workflows/ci.yml
  container:
    name: Two-image installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash scripts/test-vps-install.sh
