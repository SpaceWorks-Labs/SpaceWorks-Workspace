name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Prisma resolves datasource URLs while validating and generating, even
  # without connecting. Placeholders only.
  DATABASE_URL: postgresql://build:build@localhost:5432/sww_build
  DIRECT_URL: postgresql://build:build@localhost:5432/sww_build
  NEXT_TELEMETRY_DISABLED: "1"
  # Type-checking the full schema needs more than Node's default 2 GB heap.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      # Route types (PageProps, RouteContext) are generated, not committed.
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run typecheck:frontend
      - run: npm run build:frontend

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sww
          POSTGRES_PASSWORD: sww_ci
          POSTGRES_DB: sww_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sww -d sww_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sww:sww_ci@localhost:5432/sww_ci_test
      TEST_QUEUE_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Private S3 storage for the file-library suites (same image as production).
      - name: Start Silo storage
        run: |
          docker run -d --name silo -p 127.0.0.1:9010:9000 \
            -e MINIO_ROOT_USER=swwdev -e MINIO_ROOT_PASSWORD=sww_dev_storage_pw \
            pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7 server /data
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9010/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh pgsty/mc:RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8 -c \
            'mc alias set l http://127.0.0.1:9010 swwdev sww_dev_storage_pw && mc mb --ignore-existing l/sww-docsfiles'
      # Applies committed migrations; also proves they run on an empty database.
      - run: npm run db:test:prepare
      - run: npm run test:integration

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, not blocking: advisories without a fix must not stop every merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  hosting:
    name: Production hosting smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        deployment: [split, vps]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sww
          POSTGRES_PASSWORD: sww_ci
          POSTGRES_DB: sww_hosting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sww -d sww_hosting_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://sww:sww_ci@127.0.0.1:5432/sww_hosting_test
      DIRECT_URL: postgresql://sww:sww_ci@127.0.0.1:5432/sww_hosting_test
      REDIS_URL: redis://127.0.0.1:6379/0
      S3_ENDPOINT: http://127.0.0.1:9010
      S3_BUCKET: disposable-test
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: swwdev
      S3_SECRET_ACCESS_KEY: sww_dev_storage_pw
      S3_FORCE_PATH_STYLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start private browser storage
        run: |
          docker run -d --name silo -p 127.0.0.1:9010:9000 \
            -e MINIO_ROOT_USER=swwdev -e MINIO_ROOT_PASSWORD=sww_dev_storage_pw \
            pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7 server /data
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9010/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh pgsty/mc:RELEASE.2026-10-26T00-00-00Z@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8 -c \
            'mc alias set l http://127.0.0.1:9010 swwdev sww_dev_storage_pw && mc mb --ignore-existing l/disposable-test'
      - run: npm run test:e2e:${{ matrix.deployment }} -- --external-services --demo
