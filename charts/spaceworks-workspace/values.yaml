# Space Works Workspace Helm values. Guide: docs/DEPLOYMENT_KUBERNETES.md
#
# The chart runs the application only. Provide PostgreSQL (TLS), Redis
# (rediss://), private S3-compatible storage and SMTP as managed services.

replicaCount: 2

image:
  repository: ghcr.io/spaceworks-labs/spaceworks-workspace-backend
  # Use an immutable tag (sha-<commit>) or a digest; defaults to the chart appVersion.
  tag: "0.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Runtime configuration (every production variable in docs/CONFIGURATION.md).
# Preferred: create the Secret outside Helm (External Secrets, Sealed Secrets,
# `kubectl create secret generic --from-env-file`) and name it here.
existingSecret: ""

# Alternative for evaluation clusters: let the chart create the Secret from
# values. Never commit real values; pass them with --values from a secure path.
secret:
  create: false
  # NAME: value pairs, e.g. DATABASE_URL, AUTH_SECRET, CRON_SECRET ...
  data: {}

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # ingress-nginx: stream Server-Sent Events (/api/realtime) and allow uploads.
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-body-size: 30m
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: work.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: work-example-org-tls
  #    hosts: [work.example.org]

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Pre-install/pre-upgrade Job running `prisma migrate deploy` with the
# backend image of the same release. A failed migration blocks the rollout.
migration:
  enabled: true
  image:
    repository: ghcr.io/spaceworks-labs/spaceworks-workspace-backend
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 600

# Same backend image, private health endpoints, no Service or Ingress.
worker:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 1536Mi }
beat:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { memory: 512Mi }

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
